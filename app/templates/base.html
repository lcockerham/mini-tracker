<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mini-Tracker{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=5">
</head>
<body>
    <nav>
        <a href="/minis" class="{{ 'active' if request.url.path.startswith('/minis') }}">Miniatures</a>
        <a href="/books" class="{{ 'active' if request.url.path.startswith('/books') }}">Books</a>
        <a href="/maps" class="{{ 'active' if request.url.path.startswith('/maps') }}">Maps</a>
        <a href="/paints" class="{{ 'active' if request.url.path.startswith('/paints') }}">Paints</a>
        <a href="/wishlist" class="{{ 'active' if request.url.path.startswith('/wishlist') }}">Wishlist</a>
        <a href="/dashboard" class="{{ 'active' if request.url.path.startswith('/dashboard') }}">Dashboard</a>
        <a href="/import" class="{{ 'active' if request.url.path.startswith('/import') }}">Import</a>
    </nav>

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
