# Pinned versions for every package mini-tracker installs (Python 3.12, macOS/Linux).
# This is a pip constraints file: it fixes versions but doesn't add packages, so
# install with
#   pip install -r requirements.txt -r requirements-dev.txt -c requirements.lock
# `make check-lock` fails if anything installed isn't pinned here.
#
# Security floors (hand-patched in .venv on 2026-11-03): certifi >= 2026.10.23,
# pillow >= 13.0.0. Nothing here requires Pillow (openpyxl only uses it if it's
# installed), so the pillow pin only applies if something pulls it in later.
#
# To regenerate: build a fresh Python 3.12 venv, run
#   pip install -r requirements.txt -r requirements-dev.txt
# (add `-c requirements.lock` to keep current versions), then replace the pins
# below with `pip freeze` output and keep the pillow line.

